name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esp-idf-build:
    name: ESP-IDF Build (esp32s3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build firmware with ESP-IDF (Hardware + Virtual Bench profiles)
        if: hashFiles('CMakeLists.txt') != ''
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32s3
          command: |
            idf.py set-target esp32s3 build
            idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.virtual_bench" -B build_vbench set-target esp32s3 build

  python-tests:
    name: Python Host Tests (uv + pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        if: hashFiles('tests/**/*.py', '**/test_*.py') != ''
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        if: hashFiles('tests/**/*.py', '**/test_*.py') != ''
        run: uv python install

      - name: Install dependencies
        if: hashFiles('tests/**/*.py', '**/test_*.py') != ''
        run: uv sync --frozen

      - name: Run pytest
        if: hashFiles('tests/**/*.py', '**/test_*.py') != ''
        run: uv run pytest

  lint:
    name: Lint (ruff + clang-format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run ruff on Python tests and scripts
        run: uvx ruff check tests/ scripts/

      - name: Run clang-format on C/H sources
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-format
          find main components -name '*.c' -o -name '*.h' | xargs clang-format --dry-run --Werror
