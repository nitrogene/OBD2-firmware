[project]
name = "obd2-firmware-tools"
version = "0.1.0"
description = "Host Python tooling, protocol decoders, and test scripts for ESP32-S3 OBD-II firmware"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "libusb>=1.0.30.post2",
    "pyusb>=1.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ziglang>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
